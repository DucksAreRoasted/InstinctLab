CH block', k, ob[k][0])\n            ok = False\n    print('  ', 'ALL CODE BLOCKS IDENTICAL' if ok else 'HAS DIFF')\n\"", "Bash=cd /home/ducks/Desktop/研究计划/InstinctLab && python3 -c \"\nimport subprocess, re\nfor f in ['DOCS.md', 'README.md']:\n    old = subprocess.check_output(['git', 'show', 'HEAD:'+f]).decode()\n    new = open(f).read()\n    def urls(t):\n        return sorted(set(re.findall(r'https?://[^\\s)\\]]+', t)))\n    uo, un = urls(old), urls(new)\n    print(f, 'URLs identical:', uo == un)\n    if uo != un:\n        print('  old:', uo)\n        print('  new:', un)\n\"", "Bash=cd /home/ducks/Desktop/研究计划/InstinctLab && python3 -c \"\nimport re\n# 检查正文中是否残留长英文句子（排除代码块内的行）\nfor f in ['DOCS.md','README.md']:\n    lines = open(f).read().split('\\n')\n    inblock = False\n    hits = []\n    for i,l in enumerate(lines):\n        if l.startswith('\\`\\`\\`'):\n            inblock = not inblock\n            continue\n        if inblock: continue\n        # 找含 >=5 个连续英文单词且不含代码特征的行\n        if re.search(r'(?<![A-Za-z])[A-Za-z]+(?: [A-Za-z]+){4,}', l):\n            hits.append((i+1, l.strip()[:80]))\n    print(f, '英文正文残留行数:', len(hits))\n    for h in hits[:40]:\n        print('  ', h)\n\"", "Bash=cd /home/ducks/Desktop/研究计划/InstinctLab && echo \"DOCS fences: $(grep -c '^\\`\\`\\`' DOCS.md) / README fences: $(grep -c '^\\`\\`\\`' README.md)\" && echo \"HEAD DOCS fences: $(git show HEAD:DOCS.md | grep -c '^\\`\\`\\`') / HEAD README fences: $(git show HEAD:README.md | grep -c '^\\`\\`\\`')\"", "Bash=cd /home/ducks/Desktop/研究计划/InstinctLab && python3 -c \"\nimport subprocess\nfor f in ['DOCS.md','README.md']:\n    new = open(f).read().split('\\n')\n    old = subprocess.check_output(['git','show','HEAD:'+f]).decode().split('\\n')\n    nf = sum(1 for l in new if l.startswith('\\`\\`\\`'))\n    of = sum(1 for l in old if l.startswith('\\`\\`\\`'))\n    print(f, 'new fences', nf, 'old fences', of)\n\"", "Bash=cd /home/ducks/humanoid-motion-intelligence/论文与项目/论文逐篇解读 && cp \"P